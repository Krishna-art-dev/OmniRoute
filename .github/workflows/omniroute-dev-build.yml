name: Dev build (npm tarball)

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with upstream
        run: |
          git remote add upstream https://github.com/diegosouzapw/OmniRoute.git
          git fetch upstream --tags --force
          git remote set-head upstream --auto
          git reset --hard upstream/HEAD
          echo "HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Skip if nothing new
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST=$(gh release list --limit 1 --json tagName -q '.[0].tagName' || echo "")
          if [ -n "$LAST" ]; then
            COUNT=$(git rev-list --count "$LAST..upstream/HEAD" 2>/dev/null || echo 1)
          else
            COUNT=1
          fi
          echo "new_commits=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Upstream commits since $LAST: $COUNT"

      - name: Setup Node 24
        if: steps.check.outputs.new_commits != '0'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        if: steps.check.outputs.new_commits != '0'
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Build
        if: steps.check.outputs.new_commits != '0'
        run: |
          pnpm install --frozen-lockfile
          OMNIROUTE_BUILD_SHA=$(git rev-parse --short HEAD) pnpm run build
          pnpm run build:cli
          node scripts/build/write-build-sha.mjs

      - name: Pack and publish release
        if: steps.check.outputs.new_commits != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHORT=$(git rev-parse --short HEAD)
          TAG="v${VERSION}-dev.${SHORT}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          npm pack
          mv omniroute-"${VERSION}".tgz omniroute-"${VERSION}"-dev."${SHORT}".tgz
          gh release create "$TAG" omniroute-*.tgz \
            --title "$TAG" \
            --notes "Dev build from upstream commit ${SHORT} ($(git log -1 --format=%cs)).
          Install: npm i -g ./omniroute-*.tgz"
